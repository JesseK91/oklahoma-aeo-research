<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">First name differences and name overlap in paired answers</title><desc id="desc">The first extracted name differed in most paired answers; Jaccard overlap across the full name lists is also shown.</desc><rect width="1200" height="620" fill="#f3ead8"/><g font-family="Arial, sans-serif"><text x="60" y="45" font-size="15" fill="#f05a24" font-weight="700">REPORT 004 / FIGURE 2</text><text x="60" y="96" font-size="32" fill="#11100e" font-weight="700">The first name listed changed in most paired answers</text><text x="60" y="133" font-size="17" fill="#655d51" font-weight="400">540 pairs of buyer questions expressing the same service need.</text><text x="70" y="245" font-size="76" fill="#f05a24" font-weight="700">78.0%</text><text x="70" y="295" font-size="27" fill="#11100e" font-weight="700">First name listed differed</text><text x="70" y="335" font-size="22" fill="#655d51" font-weight="400">421 of 540 paired answers</text><text x="70" y="380" font-size="20" fill="#655d51" font-weight="400">Same first name: 119 pairs</text><text x="665" y="245" font-size="76" fill="#f05a24" font-weight="700">27.6%</text><text x="665" y="295" font-size="27" fill="#11100e" font-weight="700">Mean name overlap</text><text x="665" y="335" font-size="20" fill="#655d51" font-weight="400">Jaccard: shared names / combined set</text><text x="665" y="380" font-size="20" fill="#655d51" font-weight="400">Median: 25.0%</text><text x="60" y="540" font-size="17" fill="#655d51" font-weight="400">Names are compared under the published normalization rules; spelling variants can remain separate.</text><text x="60" y="578" font-size="17" fill="#655d51" font-weight="400">Paired differences reflect both prompt wording and ordinary model and search retrieval variation.</text></g></svg>
