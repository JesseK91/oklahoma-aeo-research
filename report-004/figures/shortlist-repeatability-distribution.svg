<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Name coverage across six buyer prompts</title><desc id="desc">Counts of extracted names appearing in one through six prompts within a city and category.</desc><rect width="1200" height="620" fill="#f3ead8"/><g font-family="Arial, sans-serif"><text x="60" y="45" font-size="15" fill="#f05a24" font-weight="700">REPORT 004 / FIGURE 1</text><text x="60" y="96" font-size="32" fill="#11100e" font-weight="700">How widely did names appear across six different prompts?</text><text x="60" y="133" font-size="17" fill="#655d51" font-weight="400">4,804 distinct city, category, and name combinations across three buyer intents.</text><text x="60" y="201" font-size="19" fill="#11100e" font-weight="400">1 of 6 prompts</text><rect x="260" y="177" width="544.50" height="32" fill="#11100e"/><text x="834.5" y="201" font-size="18" fill="#11100e" font-weight="400">2,906 (60.5%)</text><text x="60" y="260" font-size="19" fill="#11100e" font-weight="400">2 of 6 prompts</text><rect x="260" y="236" width="177.30" height="32" fill="#11100e"/><text x="467.29999999999995" y="260" font-size="18" fill="#11100e" font-weight="400">945 (19.7%)</text><text x="60" y="319" font-size="19" fill="#11100e" font-weight="400">3 of 6 prompts</text><rect x="260" y="295" width="86.40" height="32" fill="#f05a24"/><text x="376.4" y="319" font-size="18" fill="#11100e" font-weight="400">463 (9.6%)</text><text x="60" y="378" font-size="19" fill="#11100e" font-weight="400">4 of 6 prompts</text><rect x="260" y="354" width="46.80" height="32" fill="#f05a24"/><text x="336.8" y="378" font-size="18" fill="#11100e" font-weight="400">249 (5.2%)</text><text x="60" y="437" font-size="19" fill="#11100e" font-weight="400">5 of 6 prompts</text><rect x="260" y="413" width="28.80" height="32" fill="#f05a24"/><text x="318.8" y="437" font-size="18" fill="#11100e" font-weight="400">156 (3.2%)</text><text x="60" y="496" font-size="19" fill="#11100e" font-weight="400">6 of 6 prompts</text><rect x="260" y="472" width="16.20" height="32" fill="#f05a24"/><text x="306.2" y="496" font-size="18" fill="#11100e" font-weight="400">85 (1.8%)</text><text x="60" y="582" font-size="17" fill="#655d51" font-weight="400">Prompt coverage measures presence across six questions in a cell, not repeated runs of one identical prompt.</text></g></svg>
