<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Paired name agreement by service category</title><desc id="desc">Mean Jaccard overlap and first name agreement across twelve local service categories.</desc><rect width="1200" height="620" fill="#f3ead8"/><g font-family="Arial, sans-serif"><text x="60" y="45" font-size="15" fill="#f05a24" font-weight="700">REPORT 004 / FIGURE 4</text><text x="60" y="96" font-size="32" fill="#11100e" font-weight="700">Name agreement across all twelve service categories</text><text x="60" y="133" font-size="17" fill="#655d51" font-weight="400">Orange: mean Jaccard overlap. Black: same first name listed. 45 paired comparisons per category.</text><text x="60" y="178" font-size="17" fill="#11100e" font-weight="400">Auto repair</text><rect x="310" y="164" width="260.00" height="10" fill="#f05a24"/><rect x="310" y="177" width="289.00" height="10" fill="#11100e"/><text x="920" y="180" font-size="16" fill="#11100e" font-weight="400">26.0% / 28.9%</text><text x="60" y="211" font-size="17" fill="#11100e" font-weight="400">Electrical</text><rect x="310" y="197" width="339.00" height="10" fill="#f05a24"/><rect x="310" y="210" width="267.00" height="10" fill="#11100e"/><text x="920" y="213" font-size="16" fill="#11100e" font-weight="400">33.9% / 26.7%</text><text x="60" y="244" font-size="17" fill="#11100e" font-weight="400">Foundation / concrete</text><rect x="310" y="230" width="331.00" height="10" fill="#f05a24"/><rect x="310" y="243" width="178.00" height="10" fill="#11100e"/><text x="920" y="246" font-size="16" fill="#11100e" font-weight="400">33.1% / 17.8%</text><text x="60" y="277" font-size="17" fill="#11100e" font-weight="400">House cleaning</text><rect x="310" y="263" width="351.00" height="10" fill="#f05a24"/><rect x="310" y="276" width="311.00" height="10" fill="#11100e"/><text x="920" y="279" font-size="16" fill="#11100e" font-weight="400"