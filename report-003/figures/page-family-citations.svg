<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Citation activity by URL family</title>
  <desc id="desc">Horizontal bars showing 94.4 percent of page-export citations came from structured fragrance, clone, and clone-of pages.</desc>
  <rect width="1200" height="760" fill="#f3ead8"/>
  <style>
    text { font-family: "Libre Franklin", Arial, sans-serif; fill: #11100e; }
    .label { font-size: 15px; font-weight: 750; letter-spacing: 1.4px; text-transform: uppercase; fill: #f05a24; }
    .title { font-size: 45px; font-weight: 820; letter-spacing: -2.2px; }
    .note { font-size: 16px; fill: #655d51; }
    .axis { font-size: 14px; fill: #655d51; }
    .value { font-size: 17px; font-weight: 760; }
  </style>
  <text class="label" x="70" y="62">Figure 4 / Page architecture</text>
  <text class="title" x="70" y="116">Structured pages carried the citation activity.</text>
  <text class="note" x="70" y="150">Researcher-defined URL families within the 22,745-citation page export.</text>
  <text class="value" x="221" y="243" text-anchor="end">/fragrance</text>
  <rect x="245" y="215" width="800.0" height="38" fill="#f05a24" fill-opacity="1"/>
  <text class="value" x="1059.0" y="242">10,266 · 45.1%</text>
  <text class="value" x="221" y="325" text-anchor="end">/clone</text>
  <rect x="245" y="297" width="540.3" height="38" fill="#f05a24" fill-opacity="1"/>
  <text class="value" x="799.3" y="324">6,934 · 30.5%</text>
  <text class="value" x="221" y="407" text-anchor="end">/clone-of</text>
  <rect x="245" y="379" width="332.4" height="38" fill="#f05a24" fill-opacity="1"/>
  <text class="value" x="591.4" y="406">4,265 · 18.8%</text>
  <text class="value" x="221" y="489" text-anchor="end">/blog</text>
  <rect x="245" y="461" width="52.1" height="38" fill="#11100e" fill-opacity="0.76"/>
  <text class="value" x="311.1" y="488">668 · 2.9%</text>
  <text class="value" x="221" y="571" text-anchor="end">Other</text>
  <rect x="245" y="543" width="47.7" height="38" fill="#11100e" fill-opacity="0.76"/>
  <text class="value" x="306.7" y="570">612 · 2.7%</text>
  <line x1="70" y1="655" x2="1130" y2="655" stroke="#c7baa4"/>
  <text class="value" x="70" y="700">94.4%</text>
  <text class="note" x="151" y="700">of page-export citations came from /fragrance, /clone, and /clone-of pages.</text>
</svg>
