<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Grounding-query and page concentration</title>
  <desc id="desc">Comparison showing that the top ten grounding queries held 55.1 percent of query-export citations while the top ten pages held 14.7 percent of page-export citations.</desc>
  <rect width="1200" height="760" fill="#f3ead8"/>
  <style>
    text { font-family: "Libre Franklin", Arial, sans-serif; fill: #11100e; }
    .label { font-size: 15px; font-weight: 750; letter-spacing: 1.4px; text-transform: uppercase; fill: #f05a24; }
    .title { font-size: 45px; font-weight: 820; letter-spacing: -2.2px; }
    .note { font-size: 16px; fill: #655d51; }
    .axis { font-size: 14px; fill: #655d51; }
    .value { font-size: 17px; font-weight: 760; }
  </style>
  <text class="label" x="70" y="62">Figure 3 / Concentration</text>
  <text class="title" x="70" y="116">One property. Two different distribution shapes.</text>
  <text class="note" x="70" y="150">Percent of citations represented in each separate sampled export.</text>
  <text class="value" x="196" y="230.0" text-anchor="end">Top 1</text>
  <rect x="220" y="205.0" width="96.7" height="28" fill="#f05a24"/>
  <text class="value" x="328.7" y="226.0">9.1%</text>
  <rect x="220" y="243.0" width="38.5" height="20" fill="#11100e" fill-opacity="0.78"/>
  <text class="axis" x="270.5" y="259.0">3.6%</text>
  <text class="value" x="196" y="318.0" text-anchor="end">Top 3</text>
  <rect x="220" y="293.0" width="281.1" height="28" fill="#f05a24"/>
  <text class="value" x="513.1" y="314.0">26.5%</text>
  <rect x="220" y="331.0" width="83.9" height="20" fill="#11100e" fill-opacity="0.78"/>
  <text class="axis" x="315.9" y="347.0">7.9%</text>
  <text class="value" x="196" y="406.0" text-anchor="end">Top 5</text>
  <rect x="220" y="381.0" width="415.8" height="28" fill="#f05a24"/>
  <text class="value" x="647.8" y="402.0">39.1%</text>
  <rect x="220" y="419.0" width="107.7" height="20" fill="#11100e" fill-opacity="0.78"/>
  <text class="axis" x="339.7" y="435.0">10.1%</text>
  <text class="value" x="196" y="494.0" text-anchor="end">Top 10</text>
  <rect x="220" y="469.0" width="585.7" height="28" fill="#f05a24"/>
  <text class="value" x="817.7" y="490.0">55.1%</text>
  <rect x="220" y="507.0" width="155.8" height="20" fill="#11100e" fill-opacity="0.78"/>
  <text class="axis" x="387.8" y="523.0">14.7%</text>
  <text class="value" x="196" y="582.0" text-anchor="end">Top 20</text>
  <rect x="220" y="557.0" width="774.7" height="28" fill="#f05a24"/>
  <text class="value" x="1006.7" y="578.0">72.9%</text>
  <rect x="220" y="595.0" width="232.8" height="20" fill="#11100e" fill-opacity="0.78"/>
  <text class="axis" x="464.8" y="611.0">21.9%</text>
  <rect x="70" y="697" width="18" height="18" fill="#f05a24"/>
  <text class="axis" x="99" y="712">Grounding-query export</text>
  <rect x="310" y="697" width="18" height="18" fill="#11100e" fill-opacity="0.78"/>
  <text class="axis" x="339" y="712">Page export</text>
  <text class="note" x="1128" y="712" text-anchor="end">Separate views; not a joined denominator</text>
</svg>
